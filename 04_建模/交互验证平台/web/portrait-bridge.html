<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>事件画像桥接 · 合成研究</title><style>body{font:16px/1.6 system-ui;max-width:800px;margin:2rem auto;padding:0 1rem;color:#193047}label{display:block;margin:1rem 0}button{padding:.6rem 1rem;margin:.5rem .5rem .5rem 0}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f2f5f8;padding:1rem}a{color:#07549c}</style></head>
<body><a href="/research">返回研究平台</a><h1>事件画像桥接</h1><p>选择事件画像和完整合成研究参数包。系统核对后可下载网络卡和来源记录；此处不会启动求解。</p><label>事件画像 JSON <input id="portrait" type="file" accept=".json,application/json"></label><label>合成参数包 JSON <input id="bundle" type="file" accept=".json,application/json"></label><button id="check">核对并生成</button><button id="card" disabled>下载研究网络卡</button><button id="provenance" disabled>下载来源记录</button><pre id="status" role="status">尚未核对。仅支持合成研究，不能作为实际授权。</pre>
<script>
let result=null;const status=document.getElementById('status');const card=document.getElementById('card');const provenance=document.getElementById('provenance');
function reset(){result=null;card.disabled=true;provenance.disabled=true;status.textContent='输入已更改，请重新核对。'}
document.getElementById('portrait').onchange=reset;document.getElementById('bundle').onchange=reset;
document.getElementById('check').onclick=async()=>{reset();try{const a=document.getElementById('portrait').files[0],b=document.getElementById('bundle').files[0];if(!a||!b)throw Error('请选择两个JSON文件');const portrait=JSON.parse(await a.text()),bundle=JSON.parse(await b.text());const response=await fetch('/api/portrait-bridge',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({portrait,bundle})});const data=await response.json();if(!response.ok)throw Error(data.error||'核对失败');result=data;card.disabled=false;provenance.disabled=false;status.textContent='核对通过：'+data.notice+'\n事件：'+data.provenance.portrait_id+'\n来源叶字段：'+data.provenance.field_evidence.length+'\n网络卡指纹：'+data.provenance.network_card_sha256;}catch(e){status.textContent='核对失败：'+e.message;}};
function save(name,value){const url=URL.createObjectURL(new Blob([JSON.stringify(value,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
card.onclick=()=>save('network-card.json',result.card);provenance.onclick=()=>save('provenance.json',result.provenance);
</script></body></html>
